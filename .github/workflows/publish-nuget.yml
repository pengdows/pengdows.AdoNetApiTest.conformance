name: Publish NuGet packages

# The library, database fixtures, and runner are released together because the runner's
# generated projects reference the matching library packages.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine next version
        id: version
        run: |
          set -euo pipefail
          base_version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          if [[ -z "$base_version" ]]; then
            echo "No <Version> in Directory.Build.props." >&2
            exit 1
          fi

          if [[ "$base_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-beta\.([0-9]+)$ ]]; then
            release_prefix="${BASH_REMATCH[1]}"
            beta_number="${BASH_REMATCH[2]}"
          else
            echo "Expected a beta version such as 3.0.0-beta.2, got ${base_version}." >&2
            exit 1
          fi

          version="$base_version"
          while :; do
            published=0
            for id in pengdows.AdoNetApiTest.conformance pengdows.AdoNetApiTest.conformance.Databases pengdows.AdoNetApiTest.conformance.Runner; do
              status=$(curl -s -o /dev/null -w '%{http_code}' \
                "https://api.nuget.org/v3-flatcontainer/${id,,}/${version}/${id,,}.${version}.nupkg")
              echo "${id} ${version}: HTTP ${status}"
              if [[ "$status" == "200" ]]; then
                published=$((published + 1))
              fi
            done

            if (( published == 0 )); then
              break
            elif (( published != 3 )); then
              echo "Version ${version} is only partly published; resolve NuGet state before retrying." >&2
              exit 1
            fi

            beta_number=$((beta_number + 1))
            version="${release_prefix}-beta.${beta_number}"
          done

          echo "Selected version ${version}."
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check release tag
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tagged=$(git rev-list -n1 "$tag")
            if [[ "$tagged" != "$GITHUB_SHA" ]]; then
              echo "Tag ${tag} already exists on ${tagged}; update Directory.Build.props." >&2
              exit 1
            fi
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore pengdows.AdoNetApiTest.conformance.sln

      - name: Build
        run: dotnet build pengdows.AdoNetApiTest.conformance.sln --configuration Release --no-restore -p:Version="${{ steps.version.outputs.version }}"

      - name: Test packaging and runner behavior
        run: |
          dotnet test tests/Runner.Tests/Runner.Tests.csproj --configuration Release --no-build
          dotnet test tests/Repository.Tests/Repository.Tests.csproj --configuration Release --no-build

      - name: Pack
        run: |
          mkdir -p artifacts/packages
          dotnet pack src/pengdows.AdoNetApiTest.conformance/pengdows.AdoNetApiTest.conformance.csproj --configuration Release --no-build --output artifacts/packages -p:Version="${{ steps.version.outputs.version }}"
          dotnet pack src/pengdows.AdoNetApiTest.conformance.Databases/pengdows.AdoNetApiTest.conformance.Databases.csproj --configuration Release --no-build --output artifacts/packages -p:Version="${{ steps.version.outputs.version }}"
          dotnet pack src/pengdows.AdoNetApiTest.conformance.Runner/pengdows.AdoNetApiTest.conformance.Runner.csproj --configuration Release --no-build --output artifacts/packages -p:Version="${{ steps.version.outputs.version }}"

      - name: Verify packages
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          for id in pengdows.AdoNetApiTest.conformance pengdows.AdoNetApiTest.conformance.Databases pengdows.AdoNetApiTest.conformance.Runner; do
            test -f "artifacts/packages/${id}.${version}.nupkg"
          done

      - name: Log in to NuGet (Trusted Publishing)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: pengdows

      - name: Push packages
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          for id in pengdows.AdoNetApiTest.conformance pengdows.AdoNetApiTest.conformance.Databases pengdows.AdoNetApiTest.conformance.Runner; do
            dotnet nuget push "artifacts/packages/${id}.${version}.nupkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY"
          done
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Tag release
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.version }}"
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            git tag -a "$tag" -m "Release ${tag}"
            git push origin "$tag"
          fi
